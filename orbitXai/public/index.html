<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OrbitXai - AI Chat</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .chat-container {
      width: 90%;
      max-width: 600px;
      background: #1e293b;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    h1 {
      text-align: center;
      color: #38bdf8;
      margin-top: 0;
    }
    #chat-box {
      height: 300px;
      overflow-y: auto;
      border: 1px solid #334155;
      padding: 10px;
      border-radius: 8px;
      background: #0f172a;
      margin-bottom: 15px;
    }
    .message {
      margin-bottom: 10px;
    }
    .user { color: #38bdf8; font-weight: bold; }
    .ai { color: #4ade80; font-weight: bold; }
    .input-group {
      display: flex;
      gap: 10px;
    }
    input {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #fff;
    }
    button {
      padding: 10px 20px;
      border: none;
      background: #38bdf8;
      color: #0f172a;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #0284c7; color: white; }
  </style>
</head>
<body>

  <div class="chat-container">
    <h1>OrbitXai</h1>
    <div id="chat-box"></div>
    <div class="input-group">
      <input type="text" id="user-input" placeholder="Ask OrbitXai..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    async function sendMessage() {
      const inputField = document.getElementById('user-input');
      const chatBox = document.getElementById('chat-box');
      const prompt = inputField.value.trim();

      if (!prompt) return;

      chatBox.innerHTML += `<div class="message"><span class="user">You:</span> ${prompt}</div>`;
      inputField.value = '';
      chatBox.scrollTop = chatBox.scrollHeight;

      try {
        const response = await fetch('/.netlify/functions/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: prompt })
        });

        const data = await response.json();
        const reply = data.reply || "Sorry, no response received.";

        chatBox.innerHTML += `<div class="message"><span class="ai">OrbitXai:</span> ${reply}</div>`;
      } catch (err) {
        chatBox.innerHTML += `<div class="message"><span class="ai">OrbitXai:</span> Error connecting to backend.</div>`;
      }

      chatBox.scrollTop = chatBox.scrollHeight;
    }
  </script>

</body>
</html>
